{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure-RESTful Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">
</head>

<body>
    <div class="dashboard-wrapper">
        <header class="dashboard-header">
            <div>
                <h1><i class="fas fa-check-circle"></i> My Tasks</h1>
                <p id="welcomeUser" class="welcome-text"></p>
            </div>
            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </header>

        <div class="dashboard-content">
            <div class="toolbar">
                <button id="newTaskBtn" class="btn-submit btn-new-task">
                    <i class="fas fa-plus"></i> New Task
                </button>
            </div>

            <div class="error-message" id="errorBanner">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorBannerText">Error</span>
            </div>

            <div id="taskList" class="task-list"></div>

            <p id="emptyState" class="empty-state hidden">No tasks yet. Create your first one!</p>
        </div>
    </div>

    <!-- New Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-container">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            <div class="modal-header">
                <h3>New Task</h3>
            </div>

            <div class="error-message" id="formError">
                <i class="fas fa-exclamation-circle"></i>
                <span id="formErrorText">Error</span>
            </div>

            <form id="taskForm">
                <div class="form-group">
                    <label>Title</label>
                    <div class="input-wrapper">
                        <input type="text" id="taskTitle" placeholder="What needs to be done?" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <div class="input-wrapper">
                        <textarea id="taskDescription" placeholder="Optional details" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="taskStatus">
                            <option value='TODO'>To Do</option>
                            <option value='IN_PROGRESS'>In Progress</option>
                            <option value='DONE'>Done</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Priority</label>
                        <select id="taskPriority">
                            <option value='LOW'>Low</option>
                            <option value='MEDIUM' selected>Medium</option>
                            <option value='HIGH'>High</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Due Date</label>
                    <div class="input-wrapper">
                        <input type="date" id="taskDueDate" class="date-input" required>
                    </div>
                </div>

                <div class="form-group">
                <label>Notes</label>
                <textarea id="notesTextarea" placeholder="Type your notes here. They will auto-save..."></textarea>
                <span id="saveStatus" class="save-status"></span> 
                </div>

                <div class="modal-row">
                <div class="modal-label"><i class="fas fa-user-tag"></i> Assign To</div>
                <div class="modal-options">
                    <select id="assigneeSelect" class="assignee-select">
                        <option value="">Select a team member...</option>
                    </select>
                </div>
                </div>

                <button type="submit" class="btn-submit" id="taskFormBtn">
                    Save Task
                    <div class="spinner"></div>
                </button>
            </form>
        </div>
    </div>

    <script src="{% static 'dashboard.js' %}"></script>
</body>

</html>
